[project]
name = "finmlops-model-dev"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dvc[gs]>=3.67.1",
    "google-cloud-storage>=3.17.1",
    "matplotlib>=3.9",
    "mlflow>=3.18.0",
    "optuna>=5.0.0",
    "pandas<3",
    "peft>=0.21.2",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5",
    "shap>=0.54.1",
    "tqdm>=4.66",
    "transformers>=5.22.2",
]

# PyTorch comes in two builds; install exactly one:
#   uv sync --extra gpu   machines with an NVIDIA GPU (the normal build, includes CUDA)
#   uv sync --extra cpu   no GPU, and CI: about 2 GB smaller, same results, just slower
[project.optional-dependencies]
cpu = ["torch>=2.15.0"]
gpu = ["torch>=2.15.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --no-header"
